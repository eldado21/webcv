<app-header [owner]="owner"></app-header>

<main>
    <section class="item-section">
        <h2>Formations</h2>
        @for (formation of formations; track formation.id) {
            <app-experience [experience]="formation"></app-experience>
        }
    </section>

    <section class="item-section">
        <h2>Experiences</h2>
        @for (experience of experiences; track experience.id) {
            <app-experience [experience]="experience"></app-experience>
        }
    </section>

    <section class="item-section">
        <h2>Skills</h2>
        <app-skills></app-skills>
    </section>

    <section class="item-section">
        <h2>Projects</h2>
        <div class="row-section">
            @for (project of projects; track project.id) {
                <app-project [project]="project"></app-project>
            }
        </div>
    </section>

    <section class="item-section">
        <h2>Misc</h2>
        <app-misc [readings]="this.readings"></app-misc>
    </section>
</main>

<app-footer [socialUrls]="this.socialUrls"></app-footer>
