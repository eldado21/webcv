<div id="project-card" class="card-base-container">
    <button class="icon-button growth-toggle-icon" aria-label="View project details" (click)="details.open()">
        <i class="fa-solid fa-maximize"></i>
    </button>
    <img [src]="project.imageUrl" [alt]="project.title">
    <div class="card-base-content">
        <h2>{{project.title}}</h2>
        <p>{{project.creationDate}}</p>
        <p class="project-description">{{project.description}}</p>
        <button id="more-button" class="base-button" (click)="details.open()">More...</button>
    </div>
    <app-detailedproject #details [project]="project"></app-detailedproject>
</div>
